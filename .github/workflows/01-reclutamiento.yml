name: Reclutamiento de Agente
# Se detona el flujo de trabajo cuando se hace un push
# on: push
on:
    workflow_dispatch:
jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest
    
    steps:
      # Esta es nuestra primera acción | lo que quiero que suceda
      - name: El agente se presenta
        run: echo "Soy Lex Luthor, y el líder de la legión del Mal"

      # Usamos interpolación de un string 
      # sha -> identificador único de la tx
      - name: Reporte de identidad
        run: |  
          echo "Reporte de identidad"
          echo "===================="
          echo ""
          echo "Nombre clave: ${{ github.actor}}"
          echo ""
          echo "Contexto de Github" 
          echo "Repo: ${{ github.repository}}"  
          echo "Operación: ${{ github.sha}}"
          echo "Metadata: ${{ toJson(github) }}"

      - name: Capacidades del agente
        run: |
          echo "Capacidades detectadas:"
          echo "======================"
          echo ""
          echo "Sistema operativo"
          uname -a
          echo "Habilidades técnicas"
          node --version
          git --version
          python3 --version

      - name: Reconocimiento del terreno
        run: |
          echo "Reconocimiento del terreno"
          ls /    
