name: Control de Calidad

on:
  # Se detona el workflow cuando se hace push o pull request a la rama main
  push:
    branches: [main]
  pull_request:
    branches: [main]  

jobs:
  revision-de-calidad:
    runs-on: ubuntu-latest
    
    steps:
      - name: Brainiac accede a los planes
        uses: actions/checkout@v4
      - name: El consejo revisa los cambios
        # Dar privilegios o permisos de ejecución al script de validación -> validar-planes.sh
        # Ejecutar script.
        run: |
          chmod +x scripts/validar-planes.sh
          ./scripts/validar-planes.sh