name: Comunicador de la Legión

on:
  workflow_dispatch:
    inputs:
      villano:
        description: '¿ Qué villano envía el mensaje ?'
        # Indica que el campo villano es obligatorio
        required: true
        type: choice
        # Aca podemos colocar todos los villanos que necesitemos que puedan enviar un mensaje
        options: 
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac
      mensaje:
        description: 'Mensaje para el consejo'
        required: true
        default: 'La misión fue un éxito'
      prioridad:
        description: 'Nivel de prioridad'
        # Indica que el campo villano es obligatorio
        required: true
        type: choice
        # Aca podemos colocar todos los villanos que necesitemos que puedan enviar un mensaje
        options: 
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Crítica    

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      # Damos permiso para ver los archivos del repositorio -> actions/checkout@v4
      # - uses: actions/checkout@v4
      - name: 'Imprimir inputs o parámetros de entrada del workflow'
        run: |
          echo "El villano que envía el mensaje es: ${{ github.event.inputs.villano }}"
          echo "El mensaje enviado es: ${{ github.event.inputs.mensaje }}"
          echo "La prioridad del mensaje es: ${{ github.event.inputs.prioridad }}"
          echo ""
          echo "Villano: ${{ inputs.villano }}"
          echo "Mensaje: ${{ inputs.mensaje }}"
          echo "Prioridad: ${{ inputs.prioridad }}"
      